<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase-app.js"></script>
    <script src="admin.js"></script>
    <title>RO Water Bookings - R-Tech Pure Water</title>
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar">
        <h2>💧 R-Tech Pure Water</h2>
        <p class="admin-label">OWNER DASHBOARD</p>
        <nav class="sidebar-nav">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="bookings.html" class="active">📋 Bookings</a>
            <a href="customers.html">👥 Customers</a>
            <a href="messages.html">✉ Messages</a>
            <a href="../index.html" target="_blank">🌐 Live Website</a>
            <a href="#" id="sidebarLogout">🚪 Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <h1>All Bookings</h1>
                <p>Complete customer booking records</p>
            </div>
            <div class="topbar-actions">
                <button type="button" id="refreshBtn" class="btn-refresh">🔄 Refresh</button>
                <button type="button" id="topbarLogout" class="btn-logout">Logout</button>
            </div>
        </header>

        <section class="recent">
            <div class="section-header">
                <h2>All Orders / Bookings</h2>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Service</th>
                            <th>Address</th>
                            <th>Date</th>
                            <th>Message</th>
                        </tr>
                    </thead>
                    <tbody id="rows">
                        <tr>
                            <td colspan="8" style="text-align:center;padding:25px;color:#667085;">Loading bookings...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script>
document.getElementById("sidebarLogout")?.addEventListener("click", (e) => {
    e.preventDefault();
    logout();
});

document.getElementById("topbarLogout")?.addEventListener("click", (e) => {
    e.preventDefault();
    logout();
});

document.getElementById("refreshBtn")?.addEventListener("click", (e) => {
    e.preventDefault();
    loadBookings();
});

let cachedSb = null;

async function loadBookings() {
    if (!cachedSb) return;
    try {
        const r = await cachedSb.from("water_bookings").select("*").order("id", { ascending: false });
        const rowsEl = document.getElementById("rows");
        if (r.data && r.data.length > 0) {
            rowsEl.innerHTML = r.data.map(v => 
                row([v.id, v.name, v.email, v.phone, v.service, v.address, v.booking_date, v.message])
            ).join("");
        } else {
            rowsEl.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:25px;color:#667085;">No records found.</td></tr>';
        }
    } catch (err) {
        console.error("Error loading bookings:", err);
    }
}

(async () => {
    const auth = await requireAdmin();
    if (!auth) return;
    cachedSb = auth.sb;
    await loadBookings();
})();
</script>
</body>
</html>
